services:
  web:
    build: .
    restart: always
    env_file: .env
    volumes:
      - sqlite_data:/app/data
    environment:
      - DB_NAME=/app/data/db.sqlite3
    depends_on: []

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  sqlite_data:
