{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="auth-page">
  <section class="auth-card auth-card-login panel">
    <div class="auth-head">
      <h1>欢迎回来</h1>
      <p class="auth-subtitle">登录你的账号，继续协同论证体验</p>
    </div>
    <form method="post" class="stack">
      {% csrf_token %}
      {% include "accounts/partials/form_fields.html" %}
      <button class="primary" type="submit">立即登录</button>
      <p class="account-switch">还没有账号？<a href="{% url 'accounts:register' %}">立即注册</a></p>
    </form>
  </section>
</div>
{% endblock %}
