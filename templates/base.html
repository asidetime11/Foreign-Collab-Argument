{% load static %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'zh-hans' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}协同论证平台{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'survey/css/site.css' %}?v=20260518-4">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'survey:start' %}">
      <span class="brand-text">协同论证平台</span>
    </a>
    <nav class="top-actions">
      {% if user.is_authenticated %}
        <div class="account-menu" aria-label="账号操作">
          <a class="account-link" href="{% url 'accounts:profile_edit' %}">资料</a>
          <form action="{% url 'logout' %}" method="post" class="inline">{% csrf_token %}<button class="account-logout" type="submit">退出</button></form>
        </div>
      {% endif %}
    </nav>
  </header>
  <main class="shell">
    {% if messages %}
      <div class="message-stack" aria-live="polite">
        {% for message in messages %}<p class="message {{ message.tags }}">{{ message }}</p>{% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'survey/js/quality-events.js' %}?v=20260518-1"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
