{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>注册参与者账号</h1>
  <form method="post" class="stack">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="primary" type="submit">注册</button>
    <p>已有账号？<a href="{% url 'login' %}">返回登录</a></p>
  </form>
</section>
{% endblock %}
