{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<section class="auth-card panel narrow">
  <div class="auth-head">
    <h1>注册参与者账号</h1>
    <p class="auth-subtitle">加入任务，开始你的协同论证体验</p>
  </div>
  <form method="post" class="stack">
    {% csrf_token %}
    {% include "accounts/partials/form_fields.html" %}
    <button class="primary" type="submit">注册</button>
    <p class="account-switch">已有账号？<a href="{% url 'login' %}">返回登录</a></p>
  </form>
</section>
{% endblock %}
