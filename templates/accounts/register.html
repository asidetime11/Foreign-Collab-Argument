{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<div class="auth-page">
  <section class="auth-card panel">
    <div class="auth-head">
      <h1>加入我们</h1>
      <p class="auth-subtitle">创建账号，开始你的协同论证之旅</p>
    </div>
    <form method="post" class="stack">
      {% csrf_token %}
      {% include "accounts/partials/form_fields.html" %}
      <button class="primary" type="submit">立即注册</button>
      <p class="account-switch">已有账号？<a href="{% url 'login' %}">返回登录</a></p>
    </form>
  </section>
</div>
{% endblock %}
